[project]
name = "voice-ai-chained"
version = "0.1.0"
description = "Voice AI demo with chained speech-to-text, LLM, and text-to-speech"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "aiortc>=1.13.0",
    "openai>=1.106.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "black",
    "ruff",
]

[tool.uv]
# Security bumps that are newer than the org-wide uv maturity gate
# (exclude-newer = "1 week"). Scoped per package, and committed here rather
# than passed as a --exclude-newer-package CLI flag: uv keeps only one
# [options.exclude-newer-package] table in uv.lock, and any bare re-resolve
# (`uv lock`, `uv run`, `uv sync`) drops the CLI-supplied form and silently
# reverts cryptography 50.0.0 -> 49.0.0 and pyopenssl 26.4.0 -> 26.3.0.
# Dates are the day after each target's publish date.
#   cryptography 50.0.0  published 2026-07-31  (GHSA floors 46.0.5/48.0.1/49.0.0/50.0.0)
#   pyopenssl    26.4.0  published 2026-08-01  (GHSA floor 26.0.0; required by cryptography>=49)
exclude-newer-package = { cryptography = "2026-08-01", pyopenssl = "2026-08-02" }

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.black]
line-length = 88
target-version = ["py38"]
